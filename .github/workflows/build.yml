name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build COMrade.slnx -c Release -p:Platform=${{ matrix.platform }}

      - name: Test
        run: >-
          dotnet test --project COMrade.Core.Tests -c Release --no-build
          --results-directory "${{ github.workspace }}/TestResults"
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --report-xunit-trx --report-xunit-trx-filename unit.trx
          --report-xunit-html --report-xunit-html-filename unit.html
          --report-xunit-markdown --report-xunit-markdown-filename unit.md

      # No serial ports on the runner: these report as skipped.
      - name: Integration tests
        run: >-
          dotnet test --project COMrade.IntegrationTests -c Release --no-build
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx --report-xunit-trx-filename integration.trx
          --report-xunit-html --report-xunit-html-filename integration.html
          --report-xunit-markdown --report-xunit-markdown-filename integration.md

      # Also when a test failed, so the failure shows on the run page.
      - name: Test summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($run in @(@{ Name = 'Unit tests'; File = 'unit.md' }, @{ Name = 'Integration tests'; File = 'integration.md' })) {
            $report = "TestResults/$($run.File)"
            if (Test-Path $report) {
              "## $($run.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
              (Get-Content $report -Raw -Encoding utf8) -replace '(?m)^### Test Results\s*', '' | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
            }
          }

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            TestResults/*.trx
            TestResults/*.html
            TestResults/*.md

      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('TestResults/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 --tool-path tools
          tools/reportgenerator -reports:TestResults/coverage.cobertura.xml -targetdir:TestResults/coverage -reporttypes:"HtmlInline;MarkdownSummaryGithub"
          Get-Content TestResults/coverage/SummaryGithub.md -Encoding utf8 |
            Where-Object { $_ -notmatch 'only available for sponsors' } |
            ForEach-Object { $_ -replace '^# Summary$', '## Code coverage' } |
            Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('TestResults/coverage.cobertura.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.platform }}
          path: |
            TestResults/coverage.cobertura.xml
            TestResults/coverage/

      - name: Publish
        run: dotnet publish COMrade/COMrade.csproj -c Release -p:Platform=${{ matrix.platform }} -p:SelfContained=true -o publish/COMrade

      - name: Distribution
        id: distribution
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $version = ((Get-Item publish/COMrade/COMrade.dll).VersionInfo.ProductVersion -split '\+')[0]
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path publish/COMrade -DestinationPath "dist/COMrade-$version-win-$env:PLATFORM.zip"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Installer
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.distribution.outputs.version }}
        run: |
          dotnet build COMrade.Installer -c Release -p:AppFolder="$PWD/publish/COMrade" -p:ProductVersion=$(($env:VERSION -split '-')[0])
          Copy-Item COMrade.Installer/bin/Release/en-US/COMrade.msi "dist/COMrade-$env:VERSION-win-$env:PLATFORM.msi"

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.msi

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign distributions
        shell: bash
        run: |
          for file in dist/*.zip dist/*.msi; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*.msi
            dist/*.sigstore.json
          fail_on_unmatched_files: true
          generate_release_notes: true
